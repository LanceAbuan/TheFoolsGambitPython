[project]
name = "thefoolsgambit"
version = "2.0.0"
description = "AlphaZero-style chess AI that trains on a local GPU, with a live dashboard and playable website"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chess==1.11.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "numpy>=2.1",
    "psutil>=7.0",
    "huggingface_hub>=0.36",
    "stockfish>=3.28.0",
    "torch==2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "httpx>=0.27",
    "maturin>=1.16.0",
]

[tool.uv]
python-preference = "only-managed"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

# Quarantined legacy stack, pending deletion (U15 in docs/RESEARCH_NOTES.md §3):
# divergent v1 MCTS/HTTP-trainer code, 129 lint errors, not on the v2 path.
# Everything the v2 pipeline, arena, or server actually runs lives OUTSIDE this
# list and stays lint-gated. Do not add new files here.
extend-exclude = [
    "training/persistence.py",
    "training/server.py",
    "training/stockfish_engine.py",
    "train_server.py",
    "training/critic_game.py",
]
