<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Fool's Gambit</title>
    <link rel="icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/chessboard.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            display: flex;
            gap: 32px;
            padding: 24px;
            max-width: 960px;
            width: 100%;
            align-items: flex-start;
        }
        .board-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .player-bar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #16213e;
            border-radius: 8px;
        }
        .player-name {
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .player-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
        }
        .player-icon.white-icon { background: #e0e0e0; color: #333; }
        .player-icon.black-icon { background: #333; color: #e0e0e0; }
        .player-timer {
            font-family: 'Courier New', monospace;
            font-size: 20px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(255,255,255,0.05);
            color: #888;
            transition: all 0.3s;
        }
        .player-timer.active {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
        }
        .player-captures {
            font-size: 18px;
            letter-spacing: 1px;
            min-height: 20px;
            margin-top: 4px;
        }
        #myBoard {
            width: 560px;
        }
        .status-bar {
            width: 100%;
            text-align: center;
            padding: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #aaa;
        }
        .status-bar.check { color: #f87171; }
        .status-bar.game-over { color: #4ade80; font-weight: 700; }
        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 240px;
            max-width: 320px;
        }
        .panel {
            background: #16213e;
            border-radius: 12px;
            padding: 16px;
        }
        .panel-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 12px;
        }
        #movesList {
            max-height: 320px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        #movesList::-webkit-scrollbar { width: 4px; }
        #movesList::-webkit-scrollbar-track { background: transparent; }
        #movesList::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        .move-row {
            display: flex;
            gap: 4px;
            padding: 2px 0;
        }
        .move-num {
            color: #555;
            min-width: 28px;
            text-align: right;
            padding-right: 6px;
        }
        .move-san {
            padding: 2px 8px;
            border-radius: 4px;
            cursor: default;
            min-width: 56px;
            transition: background 0.15s;
        }
        .move-san:hover { background: rgba(255,255,255,0.08); }
        .move-san.latest {
            background: rgba(99, 102, 241, 0.25);
            color: #a5b4fc;
            font-weight: 700;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary { background: #6366f1; color: white; }
        .btn-primary:hover { background: #818cf8; }
        .btn-secondary { background: rgba(255,255,255,0.06); color: #ccc; }
        .btn-secondary:hover { background: rgba(255,255,255,0.12); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .thinking {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            color: #888;
            font-size: 13px;
        }
        .thinking-dots { display: flex; gap: 3px; }
        .thinking-dots span {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #6366f1;
            animation: pulse 1.2s infinite;
        }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }
        .game-over-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .game-over-overlay.active { display: flex; }
        .game-over-box {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .game-over-box h2 { font-size: 28px; margin-bottom: 8px; }
        .game-over-box p { color: #888; margin-bottom: 24px; }
        .promo-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 90;
            justify-content: center;
            align-items: center;
        }
        .promo-overlay.active { display: flex; }
        .promo-box {
            background: #16213e;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            gap: 8px;
        }
        .promo-piece {
            width: 56px; height: 56px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            cursor: pointer;
            transition: background 0.15s;
            background: rgba(255,255,255,0.06);
        }
        .promo-piece:hover { background: rgba(99, 102, 241, 0.3); }
        #live-board {
            width: 180px;
            margin: 0 auto;
        }
        @media (max-width: 768px) {
            .container { flex-direction: column; align-items: center; }
            #myBoard { width: min(560px, 90vw); }
            .sidebar { min-width: unset; max-width: unset; width: min(560px, 90vw); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-col">
            <div class="player-bar" id="black-bar">
                <div>
                    <div class="player-name">
                        <span class="player-icon black-icon">R</span>
                        <span>AI (Minimax)</span>
                    </div>
                    <div class="player-captures" id="black-captures"></div>
                </div>
                <div class="player-timer" id="black-timer">10:00</div>
            </div>
            <div id="myBoard"></div>
            <div class="player-bar" id="white-bar">
                <div>
                    <div class="player-name">
                        <span class="player-icon white-icon">P</span>
                        <span>You</span>
                    </div>
                    <div class="player-captures" id="white-captures"></div>
                </div>
                <div class="player-timer active" id="white-timer">10:00</div>
            </div>
            <div class="status-bar" id="status">Loading...</div>
        </div>

        <div class="sidebar">
            <div class="panel">
                <div class="panel-title">Moves</div>
                <div id="movesList"><div style="color:#555; font-style:italic;">No moves yet</div></div>
            </div>

            <div class="panel">
                <div class="panel-title">Controls</div>
                <div class="buttons">
                    <button class="btn btn-primary" id="btn-new">New Game</button>
                    <button class="btn btn-secondary" id="btn-undo">Undo Move</button>
                    <button class="btn btn-secondary" id="btn-flip">Flip Board</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Training</div>
                <div id="train-status" style="font-size:12px; color:#888;">Not connected</div>
                <div id="train-metrics" style="font-size:12px; color:#888; line-height:1.8;"></div>
                <div class="buttons" style="margin-top:8px;">
                    <button class="btn btn-secondary" id="btn-train-start">Start Training</button>
                    <button class="btn btn-secondary" id="btn-train-stop" disabled>Stop Training</button>
                    <button class="btn btn-secondary" id="btn-train-play">Play 1 Game</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Live Training Board</div>
                <div id="live-board"></div>
                <div id="live-board-status" style="font-size:11px; color:#888; text-align:center; padding:4px;">Waiting for training...</div>
            </div>

            <div class="panel">
                <div class="panel-title">Training Games</div>
                <div id="train-games" style="max-height:240px; overflow-y:auto; font-size:12px;">
                    <div style="color:#555; font-style:italic;">No training games yet</div>
                </div>
            </div>

            <div class="thinking" id="thinking" style="display:none;">
                <div class="thinking-dots"><span></span><span></span><span></span></div>
                <span>AI thinking...</span>
            </div>
        </div>
    </div>

    <div class="game-over-overlay" id="gameover-overlay">
        <div class="game-over-box">
            <h2 id="gameover-title">Game Over</h2>
            <p id="gameover-message"></p>
            <button class="btn btn-primary" id="btn-new-gameover" style="width:200px;">Play Again</button>
        </div>
    </div>

    <div class="promo-overlay" id="promo-overlay">
        <div class="promo-box" id="promo-box">
            <div class="promo-piece" data-piece="q">♕</div>
            <div class="promo-piece" data-piece="r">♖</div>
            <div class="promo-piece" data-piece="b">♗</div>
            <div class="promo-piece" data-piece="n">♘</div>
        </div>
    </div>

    <script src="/static/jquery.min.js"></script>
    <script src="/static/chessboard.js"></script>
    <script src="/static/chess.js"></script>
    <script>
    (function () {
        var state = {
            fen: '',
            legal: [],
            turn: 'white',
            sanList: [],
            inCheck: false,
            gameover: false,
            fenHistory: []
        };

        var isAiThinking = false;
        var pendingPromo = null;
        var board = null;
        var whiteTime = 600, blackTime = 600;
        var timerInterval = null;
        var currentOrientation = 'white';
        var lastFromSq = null, lastToSq = null;
        var trainPollInterval = null;
        var trainAvailable = false;

        /* ---------- chessboard.js ---------- */

        function onDragStart(source, piece, pos, dropOff) {
            if (state.gameover || isAiThinking) return false;
            if (state.turn !== 'white') return false;
            if (piece.search(/^b/) !== -1) return false;
        }

        function onDrop(source, target) {
            var move = source + target;
            var piece = board.position();
            var pawnRow = parseInt(source[1]);
            var isWhitePromo = state.turn === 'white' && pawnRow === 2 && parseInt(target[1]) === 8;
            var isBlackPromo = state.turn === 'black' && parseInt(source[1]) === 5 && parseInt(target[1]) === 1;

            if (isWhitePromo) {
                pendingPromo = { from: source, to: target };
                showPromoDialog();
                return 'snapback';
            }

            makeMove(move);
            return 'legal';
        }

        function onSnapEnd() {
            board.position(state.fen);
        }

        function updateBoard() {
            board.position(state.fen);
            lastFromSq = null;
            lastToSq = null;
        }

        function initBoard() {
            var config = {
                draggable: true,
                position: 'start',
                orientation: 'white',
                pieceTheme: '/static/img/chesspieces/wikipedia/{piece}.png',
                pieceTheme: function (piece) {
                    return '/static/img/chesspieces/wikipedia/' + piece + '.png';
                },
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd,
                showNotation: true,
                moveSpeed: 200,
                snapbackSpeed: 50,
                snapSpeed: 100
            };
            board = Chessboard('myBoard', config);
        }

        /* ---------- Promotion dialog ---------- */

        function showPromoDialog() {
            $('#promo-overlay').addClass('active');
        }

        $('#promo-box .promo-piece').on('click', function () {
            var piece = $(this).data('piece');
            if (pendingPromo) {
                var uci = pendingPromo.from + pendingPromo.to + piece;
                pendingPromo = null;
                $('#promo-overlay').removeClass('active');
                makeMove(uci);
            }
        });

        /* ---------- API ---------- */

        function makeMove(uci) {
            if (isAiThinking) return;
            $.ajax({
                url: '/api/make-move',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ uci: uci, fen: state.fen, legal: state.legal }),
                success: function (res) {
                    if (res.error) {
                        console.error('Move error:', res.error);
                        return;
                    }
                    lastFromSq = uci.substring(0, 2);
                    lastToSq = uci.substring(2, 4);
                    updateState(res);
                    if (!state.gameover && state.turn === 'black') {
                        isAiThinking = true;
                        $('#thinking').show();
                        renderStatus();
                        setTimeout(function () { requestAiMove(); }, 100);
                    }
                },
                error: function () { console.error('Request failed'); }
            });
        }

        function requestAiMove() {
            $.ajax({
                url: '/api/ai-move',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ fen: state.fen, legal: state.legal, aiDepth: 3 }),
                success: function (res) {
                    isAiThinking = false;
                    $('#thinking').hide();
                    updateState(res);
                },
                error: function () {
                    isAiThinking = false;
                    $('#thinking').hide();
                    console.error('AI move failed');
                }
            });
        }

        function updateState(res) {
            state.fenHistory.push(state.fen);
            state.fen = res.fen;
            state.legal = res.legal;
            state.turn = res.turn;
            state.inCheck = res.in_check || false;
            if (res.pgn && res.pgn.trim()) {
                state.sanList.push(res.pgn.trim());
            }
            if (res.status && res.status !== 'active') {
                state.gameover = true;
                stopTimer();
                $('#gameover-title').text(res.result || 'Game Over');
                $('#gameover-message').text('');
                $('#gameover-overlay').addClass('active');
            }
            updateBoard();
            renderStatus();
            renderMoves();
            updateCaptures();
        }

        /* ---------- Captures ---------- */

        function updateCaptures() {
            var start = fenToPieces('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1');
            var current = fenToPieces(state.fen);
            var whiteCaptured = {}, blackCaptured = {};
            var pieceOrder = { q: 0, r: 1, b: 2, n: 3, p: 4 };
            var symbols = { q: '♕', r: '♖', b: '♗', n: '♘', p: '♙' };

            for (var sq in start) {
                var p = start[sq];
                if (!current[sq]) {
                    if (p.color === 'w') blackCaptured[p.role] = (blackCaptured[p.role] || 0) + 1;
                    else whiteCaptured[p.role] = (whiteCaptured[p.role] || 0) + 1;
                }
            }

            var sortFn = function (a, b) { return (pieceOrder[a] || 9) - (pieceOrder[b] || 9); };

            var wStr = Object.keys(whiteCaptured).sort(sortFn).map(function (r) {
                return symbols[r].repeat(whiteCaptured[r]);
            }).join('');
            var bStr = Object.keys(blackCaptured).sort(sortFn).map(function (r) {
                return (r === 'p' ? '♟' : (function (m) { return { q: '♛', r: '♜', b: '♝', n: '♞' }[m]; })(r)).repeat(blackCaptured[r]);
            }).join('');

            $('#white-captures').text(wStr);
            $('#black-captures').text(bStr);
        }

        function fenToPieces(fen) {
            var pieces = {};
            var rows = fen.split(' ')[0].split('/');
            for (var r = 0; r < 8; r++) {
                var file = 0;
                for (var i = 0; i < rows[r].length; i++) {
                    var ch = rows[r][i];
                    if (ch >= '1' && ch <= '8') file += parseInt(ch);
                    else {
                        var color = (ch === ch.toUpperCase()) ? 'w' : 'b';
                        var role = ch.toLowerCase();
                        pieces[String.fromCharCode(97 + file) + (8 - r)] = { role: role, color: color };
                        file++;
                    }
                }
            }
            return pieces;
        }

        /* ---------- Render ---------- */

        function renderStatus() {
            var el = document.getElementById('status');
            el.className = 'status-bar';
            if (state.gameover) {
                el.className += ' game-over';
                el.textContent = 'Game Over';
            } else if (state.inCheck) {
                el.className += ' check';
                el.textContent = (state.turn === 'white' ? 'White' : 'Black') + ' is in check!';
            } else {
                el.textContent = state.turn === 'white' ? 'Your turn' : 'AI thinking...';
            }
            $('#white-timer').toggleClass('active', state.turn === 'white' && !state.gameover);
            $('#black-timer').toggleClass('active', state.turn === 'black' && !state.gameover);
        }

        function renderMoves() {
            if (state.sanList.length === 0) {
                $('#movesList').html('<div style="color:#555; font-style:italic;">No moves yet</div>');
                return;
            }
            var html = '';
            for (var i = 0; i < state.sanList.length; i += 2) {
                var num = Math.floor(i / 2) + 1;
                var cls1 = (i === state.sanList.length - 1) ? 'move-san latest' : 'move-san';
                var cls2 = (i + 1 === state.sanList.length - 1) ? 'move-san latest' : 'move-san';
                html += '<div class="move-row">';
                html += '<span class="move-num">' + num + '.</span>';
                html += '<span class="' + cls1 + '">' + state.sanList[i] + '</span>';
                if (state.sanList[i + 1]) {
                    html += '<span class="' + cls2 + '">' + state.sanList[i + 1] + '</span>';
                }
                html += '</div>';
            }
            $('#movesList').html(html);
            var el = document.getElementById('movesList');
            el.scrollTop = el.scrollHeight;
        }

        /* ---------- Timer ---------- */

        function startTimer() {
            stopTimer();
            timerInterval = setInterval(function () {
                if (state.gameover) { stopTimer(); return; }
                if (state.turn === 'white') {
                    whiteTime -= 1;
                    if (whiteTime <= 0) { whiteTime = 0; stopTimer(); }
                    $('#white-timer').text(formatTime(whiteTime));
                } else {
                    blackTime -= 1;
                    if (blackTime <= 0) { blackTime = 0; stopTimer(); }
                    $('#black-timer').text(formatTime(blackTime));
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        }

        function formatTime(sec) {
            var m = Math.floor(sec / 60);
            var s = sec % 60;
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        /* ---------- New game / Undo / Flip ---------- */

        function newGame() {
            $.ajax({
                url: '/api/new-game',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({}),
                success: function (res) {
                    state.fen = res.fen;
                    state.legal = res.legal;
                    state.turn = res.turn;
                    state.sanList = [];
                    state.inCheck = false;
                    state.gameover = false;
                    state.fenHistory = [];
                    lastFromSq = null;
                    lastToSq = null;
                    isAiThinking = false;
                    pendingPromo = null;
                    $('#thinking').hide();
                    $('#gameover-overlay').removeClass('active');
                    $('#promo-overlay').removeClass('active');
                    whiteTime = 600;
                    blackTime = 600;
                    $('#white-timer').text('10:00');
                    $('#black-timer').text('10:00');
                    startTimer();
                    updateBoard();
                    renderStatus();
                    renderMoves();
                    updateCaptures();
                },
                error: function () { console.error('New game failed'); }
            });
        }

        function undoMove() {
            $.ajax({
                url: '/api/undo',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ fen: state.fen }),
                success: function (res) {
                    if (state.fenHistory.length > 0) state.fenHistory.pop();
                    state.fen = res.fen;
                    state.legal = res.legal;
                    state.turn = res.turn;
                    state.inCheck = res.in_check || false;
                    state.gameover = false;
                    if (state.sanList.length > 0) state.sanList.pop();
                    if (state.sanList.length > 0) state.sanList.pop();
                    lastFromSq = null;
                    lastToSq = null;
                    $('#gameover-overlay').removeClass('active');
                    isAiThinking = false;
                    $('#thinking').hide();
                    updateBoard();
                    renderStatus();
                    renderMoves();
                    updateCaptures();
                },
                error: function () { console.error('Undo failed'); }
            });
        }

        function flipBoard() {
            board.orientation(currentOrientation === 'white' ? 'black' : 'white');
            currentOrientation = currentOrientation === 'white' ? 'black' : 'white';
        }

        /* ---------- Training ---------- */

        function fetchTrainStatus() {
            $.ajax({
                url: '/api/train/status',
                method: 'GET',
                timeout: 3000,
                success: function (status) {
                    trainAvailable = true;
                    $('#train-status').text(
                        (status.status || 'idle').charAt(0).toUpperCase() + (status.status || 'idle').slice(1)
                    );
                    $('#train-metrics').html(
                        '<div>Step: ' + (status.step || 0) + '</div>' +
                        '<div>Games: ' + (status.games_played || 0) + '</div>' +
                        '<div>Buffer: ' + (status.buffer_size || 0) + '</div>' +
                        '<div>Loss: ' + (status.loss ? status.loss.toFixed(4) : 'N/A') + '</div>'
                    );
                    var isRunning = status.status === 'playing' || status.status === 'training';
                    $('#btn-train-start').prop('disabled', isRunning);
                    $('#btn-train-stop').prop('disabled', !isRunning);
                    if (status.recent_games && status.recent_games.length > 0) {
                        renderTrainGames(status.recent_games);
                    }
                    if (status.hf_repo) {
                        $('#train-metrics').append('<div style="color:#6366f1;">HF: ' + status.hf_repo + '</div>');
                    }
                },
                error: function () { }
            });
        }

        function renderTrainGames(games) {
            var html = '';
            for (var i = 0; i < games.length; i++) {
                var g = games[i];
                var resultColor = '#888';
                if (g.result === '1-0') resultColor = '#4ade80';
                else if (g.result === '0-1') resultColor = '#f87171';
                else if (g.result === '1/2-1/2') resultColor = '#fbbf24';
                var mode = (g.mode || 'self-play').charAt(0).toUpperCase() + (g.mode || 'self-play').slice(1);

                var moves = '';
                if (g.pgn) {
                    var parts = g.pgn.split(' ').filter(function(s) { return s; });
                    moves = parts.slice(-6).join(' ') + (parts.length > 6 ? '...' : '');
                }

                html += '<div style="padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.05);">';
                html += '<div style="display:flex; justify-content:space-between; margin-bottom:2px;">';
                html += '<span style="color:#666;">#' + g.game_num + ' <span style="color:#6366f1;">[' + mode + ']</span></span>';
                html += '<span style="color:' + resultColor + '; font-weight:700;">' + g.result + '</span>';
                html += '</div>';
                if (moves) {
                    html += '<div style="color:#555; font-family:monospace; font-size:11px;">' + moves + '</div>';
                }
                html += '</div>';
            }
            $('#train-games').html(html);
        }

        /* ---------- Live Training Board ---------- */

        var liveBoard = null;
        var liveBoardFen = 'start';
        var liveMoves = [];

        function initLiveBoard() {
            var config = {
                position: 'start',
                orientation: 'white',
                pieceTheme: function (piece) {
                    return '/static/img/chesspieces/wikipedia/' + piece + '.png';
                },
                draggable: false,
                showNotation: true
            };
            liveBoard = Chessboard('live-board', config);
        }

        function updateLiveBoard(moves) {
            if (!moves || moves.length === 0) return;
            liveMoves = moves;
            var board = new chessjs();
            for (var i = 0; i < moves.length; i++) {
                try {
                    board.move(moves[i]);
                } catch(e) {
                    break;
                }
            }
            var fen = board.fen();
            liveBoard.position(fen);
            var moveCount = moves.length;
            var lastMove = moves[moves.length - 1] || '';
            $('#live-board-status').text('Live: ' + moveCount + ' moves | Last: ' + lastMove);
        }

        function connectSSE() {
            try {
                var source = new EventSource('/api/train/stream');
                source.addEventListener('game_progress', function(e) {
                    var data = JSON.parse(e.data);
                    if (data.moves) updateLiveBoard(data.moves);
                    $('#live-board-status').text('Status: ' + data.status);
                });
                source.addEventListener('train_step', function(e) {
                    var data = JSON.parse(e.data);
                    if (data.data) {
                        $('#train-metrics').html(
                            '<div>Step: ' + data.data.step + '</div>' +
                            '<div>Games: ' + (data.data.buffer_size || 0) + '</div>' +
                            '<div>Loss: ' + (data.data.loss ? data.data.loss.toFixed(4) : 'N/A') + '</div>'
                        );
                    }
                });
                source.addEventListener('game_start', function(e) {
                    var data = JSON.parse(e.data);
                    $('#live-board-status').text('New ' + data.mode + ' game starting...');
                    liveBoard.position('start');
                    liveMoves = [];
                });
                source.addEventListener('training_stopped', function(e) {
                    $('#live-board-status').text('Training stopped');
                });
                source.onerror = function() {
                    // SSE reconnects automatically
                };
            } catch(e) {
                // SSE not supported
            }
        }

        function renderTrainGames(games) {
            var html = '';
            for (var i = 0; i < games.length; i++) {
                var g = games[i];
                var resultColor = '#888';
                if (g.result === '1-0') resultColor = '#4ade80';
                else if (g.result === '0-1') resultColor = '#f87171';
                else if (g.result === '1/2-1/2') resultColor = '#fbbf24';

                var moves = '';
                if (g.pgn) {
                    var parts = g.pgn.split(' ').filter(function(s) { return s; });
                    moves = parts.slice(-6).join(' ') + (parts.length > 6 ? '...' : '');
                }

                html += '<div style="padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.05);">';
                html += '<div style="display:flex; justify-content:space-between; margin-bottom:2px;">';
                html += '<span style="color:#666;">Game #' + g.game_num + '</span>';
                html += '<span style="color:' + resultColor + '; font-weight:700;">' + g.result + '</span>';
                html += '</div>';
                if (moves) {
                    html += '<div style="color:#555; font-family:monospace; font-size:11px;">' + moves + '</div>';
                }
                html += '</div>';
            }
            $('#train-games').html(html);
        }

        function trainStart() {
            $.ajax({
                url: '/api/train/start',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ games_per_cycle: 5, steps_per_cycle: 50 }),
                success: function () {
                    if (!trainPollInterval) {
                        trainPollInterval = setInterval(fetchTrainStatus, 2000);
                    }
                    fetchTrainStatus();
                },
                error: function () { $('#train-status').text('Error starting'); }
            });
        }

        function trainStop() {
            $.ajax({
                url: '/api/train/stop',
                method: 'POST',
                contentType: 'application/json',
                success: function () {
                    clearInterval(trainPollInterval);
                    trainPollInterval = null;
                    fetchTrainStatus();
                },
                error: function () { $('#train-status').text('Error stopping'); }
            });
        }

        function trainPlay() {
            $.ajax({
                url: '/api/train/play',
                method: 'POST',
                contentType: 'application/json',
                success: function (res) {
                    $('#train-status').text('Game ' + res.games_played + ' played');
                    if (!trainPollInterval) fetchTrainStatus();
                },
                error: function () { $('#train-status').text('Error playing game'); }
            });
        }

       /* ---------- Init ---------- */

        $(function () {
            $('#btn-new').on('click', newGame);
            $('#btn-new-gameover').on('click', newGame);
            $('#btn-undo').on('click', undoMove);
            $('#btn-flip').on('click', flipBoard);
            $('#btn-train-start').on('click', trainStart);
            $('#btn-train-stop').on('click', trainStop);
            $('#btn-train-play').on('click', trainPlay);

            initBoard();
            initLiveBoard();
            newGame();
            fetchTrainStatus();
            connectSSE();
        });
    })();
    </script>
</body>
