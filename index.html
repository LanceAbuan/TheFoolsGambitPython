<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Fool's Gambit</title>
    <link rel="icon" href="/static/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            gap: 32px;
            padding: 24px;
            max-width: 960px;
            width: 100%;
            align-items: flex-start;
        }

        .board-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .player-bar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #16213e;
            border-radius: 8px;
        }

        .player-name {
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .player-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
        }

        .player-icon.white-icon { background: #e0e0e0; color: #333; }
        .player-icon.black-icon { background: #333; color: #e0e0e0; }

        .player-timer {
            font-family: 'Courier New', monospace;
            font-size: 20px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(255,255,255,0.05);
            color: #888;
            transition: all 0.3s;
        }

        .player-timer.active {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
        }

        .player-captures {
            font-size: 16px;
            letter-spacing: 1px;
            min-height: 20px;
            margin-top: 4px;
        }

        #board {
            width: min(560px, 85vw);
            height: min(560px, 85vw);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .status-bar {
            width: 100%;
            text-align: center;
            padding: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #aaa;
        }

        .status-bar.check { color: #f87171; }
        .status-bar.game-over { color: #4ade80; font-weight: 700; }

        /* Sidebar */
        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 240px;
            max-width: 320px;
        }

        .panel {
            background: #16213e;
            border-radius: 12px;
            padding: 16px;
        }

        .panel-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 12px;
        }

        .moves-list {
            max-height: 320px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .moves-list::-webkit-scrollbar { width: 4px; }
        .moves-list::-webkit-scrollbar-track { background: transparent; }
        .moves-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        .move-row {
            display: flex;
            gap: 4px;
            padding: 2px 0;
        }

        .move-num {
            color: #555;
            min-width: 28px;
            text-align: right;
            padding-right: 6px;
        }

        .move-san {
            padding: 2px 8px;
            border-radius: 4px;
            cursor: default;
            min-width: 56px;
            transition: background 0.15s;
        }

        .move-san:hover {
            background: rgba(255,255,255,0.08);
        }

        .move-san.latest {
            background: rgba(99, 102, 241, 0.25);
            color: #a5b4fc;
            font-weight: 700;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: #6366f1;
            color: white;
        }

        .btn-primary:hover {
            background: #818cf8;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: #ccc;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.12);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .thinking {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            color: #888;
            font-size: 13px;
        }

        .thinking-dots {
            display: flex;
            gap: 3px;
        }

        .thinking-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #6366f1;
            animation: pulse 1.2s infinite;
        }

        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        .game-over-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .game-over-overlay.active {
            display: flex;
        }

        .game-over-box {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .game-over-box h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .game-over-box p {
            color: #888;
            margin-bottom: 24px;
        }

        .promo-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 90;
            justify-content: center;
            align-items: center;
        }

        .promo-overlay.active { display: flex; }

        .promo-box {
            background: #16213e;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            gap: 8px;
        }

        .promo-piece {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            cursor: pointer;
            transition: background 0.15s;
            background: rgba(255,255,255,0.06);
        }

        .promo-piece:hover {
            background: rgba(99, 102, 241, 0.3);
        }

        /* Chessground overrides */
        .cg-board {
            background: #779556 !important;
        }

        .cg-wrap, .cg-board, .cg-board > * {
            border-radius: 0 !important;
        }

        .cg-square {
            border-radius: 0 !important;
        }

        .cg-highlight.move {
            background: rgba(99, 102, 241, 0.4) !important;
        }

        .cg-highlight.pre {
            background: rgba(99, 102, 241, 0.25) !important;
        }

        .cg-piece {
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
        }

        .coord { font-size: 11px !important; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-col">
            <div class="player-bar" id="black-bar">
                <div>
                    <div class="player-name">
                        <span class="player-icon black-icon">R</span>
                        <span>AI</span>
                    </div>
                    <div class="player-captures" id="black-captures"></div>
                </div>
                <div class="player-timer" id="black-timer">10:00</div>
            </div>
            <div id="board"></div>
            <div class="player-bar" id="white-bar">
                <div>
                    <div class="player-name">
                        <span class="player-icon white-icon">P</span>
                        <span>You</span>
                    </div>
                    <div class="player-captures" id="white-captures"></div>
                </div>
                <div class="player-timer active" id="white-timer">10:00</div>
            </div>
            <div class="status-bar" id="status">Your turn</div>
        </div>

        <div class="sidebar">
            <div class="panel">
                <div class="panel-title">Moves</div>
                <div class="moves-list" id="moves-list">
                    <div style="color:#555; font-style:italic;">No moves yet</div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Game</div>
                <div class="buttons">
                    <button class="btn btn-primary" id="btn-new">New Game</button>
                    <button class="btn btn-secondary" id="btn-undo">Undo</button>
                    <button class="btn btn-secondary" id="btn-flip">Flip Board</button>
                </div>
                <div class="thinking" id="thinking" style="display:none;">
                    <div class="thinking-dots"><span></span><span></span><span></span></div>
                    <span>AI thinking...</span>
                </div>
            </div>
        </div>
    </div>

    <div class="game-over-overlay" id="gameover-overlay">
        <div class="game-over-box">
            <h2 id="gameover-title">Game Over</h2>
            <p id="gameover-message"></p>
            <button class="btn btn-primary" id="btn-new-gameover" style="width:200px;">Play Again</button>
        </div>
    </div>

    <div class="promo-overlay" id="promo-overlay">
        <div class="promo-box" id="promo-box">
            <div class="promo-piece" data-piece="q">♕</div>
            <div class="promo-piece" data-piece="r">♖</div>
            <div class="promo-piece" data-piece="b">♗</div>
            <div class="promo-piece" data-piece="n">♘</div>
        </div>
    </div>

    <script src="/static/jquery.min.js"></script>
    <script src="/static/chessground.min.js"></script>
    <script src="/static/chessground.cburnett.css"></script>
    <script>
    (function() {
        const Chessground = window.Chessground;
        if (!Chessground) {
            document.body.innerHTML = '<div style="color:red;padding:40px;text-align:center;font-size:24px;">Chessground failed to load. Check console.</div>';
            return;
        }

        var state = {
            fen: '',
            legal: [],
            turn: 'white',
            sanList: [],
            inCheck: false,
            gameover: false,
            fenHistory: []
        };

        var orientation = 'white';
        var isAiThinking = false;
        var pendingPromo = null;
        var board = null;
        var whiteTime = 600, blackTime = 600;
        var timerInterval = null;
        var lastUci = null;

        // --- Board rendering ---
        function fenToPieces(fen) {
            var pieces = {};
            var rows = fen.split(' ')[0].split('/');
            for (var r = 0; r < 8; r++) {
                var file = 0;
                for (var i = 0; i < rows[r].length; i++) {
                    var ch = rows[r][i];
                    if (ch >= '1' && ch <= '8') {
                        file += parseInt(ch);
                    } else {
                        var color = (ch === ch.toUpperCase()) ? 'w' : 'b';
                        var role = ch.toLowerCase();
                        var sq = String.fromCharCode(97 + file) + (8 - r);
                        pieces[sq] = { role: role, color: color };
                        file++;
                    }
                }
            }
            return pieces;
        }

        function uciToSquares(uci) {
            return { from: uci.substring(0, 2), to: uci.substring(2, 4) };
        }

        function renderBoard() {
            var pieces = fenToPieces(state.fen);
            var dests = {};
            for (var i = 0; i < state.legal.length; i++) {
                var m = state.legal[i];
                var from = m.substring(0, 2);
                var to = m.substring(2, 4);
                if (!dests[from]) dests[from] = [];
                dests[from].push(to);
            }

            var lastMove = lastUci ? uciToSquares(lastUci) : null;

            var cfg = {
                fen: state.fen,
                orientation: orientation,
                turnColor: state.turn === 'white' ? 'w' : 'b',
                check: state.inCheck ? (state.turn === 'white' ? 'w' : 'b') : null,
                move: lastMove ? { last: [lastMove.from, lastMove.to] } : {},
                highlight: {
                    lastMove: true,
                    check: true,
                },
                animation: { enabled: true, duration: 150 },
                movable: {
                    color: 'w',
                    dests: state.turn === 'white' && !state.gameover && !isAiThinking ? dests : {},
                    events: {
                        after: function(from, to, meta) {
                            onPlayerMove(from, to);
                        }
                    },
                    free: false,
                    requireControl: true,
                    auto: true,
                    promote: {
                        enabled: true,
                        dests: dests
                    }
                },
                premove: {
                    enabled: state.turn === 'white' && !state.gameover && !isAiThinking,
                    move: function(from, to) {
                        onPlayerMove(from, to);
                    },
                    cancel: function() {}
                },
                drawable: { enabled: false },
                viewOnly: state.turn !== 'white' || state.gameover || isAiThinking,
                coordinates: {
                    vertical: true,
                    horizontal: true
                },
                colors: {
                    classic: true
                }
            };

            if (!board) {
                board = Chessground(document.getElementById('board'), cfg);
            } else {
                board.set(cfg);
            }
        }

        // --- Player move ---
        function onPlayerMove(from, to, meta) {
            if (state.gameover || isAiThinking || state.turn !== 'white') return;

            var uci = from + to;

            // Check promotion
            var isPromo = meta && meta.promotion;
            var pawnRow = parseInt(from[1]);
            if (pawnRow === 2 && parseInt(to[1]) === 8) {
                // White pawn promotion
                if (meta && meta.promotion) {
                    uci += meta.promotion;
                } else {
                    pendingPromo = { from: from, to: to };
                    showPromoDialog();
                    return;
                }
            }

            makeMove(uci);
        }

        function showPromoDialog() {
            $('#promo-overlay').addClass('active');
        }

        $('#promo-box .promo-piece').on('click', function() {
            var piece = $(this).data('piece');
            if (pendingPromo) {
                var uci = pendingPromo.from + pendingPromo.to + piece;
                pendingPromo = null;
                $('#promo-overlay').removeClass('active');
                makeMove(uci);
            }
        });

        // --- API calls ---
        function makeMove(uci) {
            if (isAiThinking) return;

            $.ajax({
                url: '/api/make-move',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ uci: uci, fen: state.fen, legal: state.legal }),
                success: function(res) {
                    if (res.error) {
                        console.error('Move error:', res.error);
                        return;
                    }
                    lastUci = uci;
                    updateState(res);

                    if (!state.gameover && state.turn === 'black') {
                        isAiThinking = true;
                        $('#thinking').show();
                        renderBoard();
                        renderStatus();
                        setTimeout(function() { requestAiMove(); }, 100);
                    }
                },
                error: function() { console.error('Request failed'); }
            });
        }

        function requestAiMove() {
            $.ajax({
                url: '/api/ai-move',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ fen: state.fen, legal: state.legal, aiDepth: 3 }),
                success: function(res) {
                    isAiThinking = false;
                    $('#thinking').hide();
                    updateState(res);
                },
                error: function() {
                    isAiThinking = false;
                    $('#thinking').hide();
                    console.error('AI move failed');
                }
            });
        }

        function updateState(res) {
            state.fenHistory.push(state.fen);
            state.fen = res.fen;
            state.legal = res.legal;
            state.turn = res.turn;
            state.inCheck = res.in_check || false;

            if (res.pgn && res.pgn.trim()) {
                state.sanList.push(res.pgn.trim());
            }

            if (res.status && res.status !== 'active') {
                state.gameover = true;
                stopTimer();
                $('#gameover-title').text(res.result || 'Game Over');
                $('#gameover-message').text('');
                $('#gameover-overlay').addClass('active');
            }

            renderBoard();
            renderStatus();
            renderMoves();
        }

        function renderStatus() {
            var el = document.getElementById('status');
            el.className = 'status-bar';

            if (state.gameover) {
                el.className += ' game-over';
                el.textContent = state.gameover ? 'Game Over' : '';
            } else if (state.inCheck) {
                el.className += ' check';
                el.textContent = (state.turn === 'white' ? 'White' : 'Black') + ' is in check!';
            } else {
                el.textContent = state.turn === 'white' ? 'Your turn' : 'AI thinking...';
            }

            // Update timer highlights
            $('#white-timer').toggleClass('active', state.turn === 'white' && !state.gameover);
            $('#black-timer').toggleClass('active', state.turn === 'black' && !state.gameover);
        }

        function renderMoves() {
            var $list = $('#moves-list');
            if (state.sanList.length === 0) {
                $list.html('<div style="color:#555; font-style:italic;">No moves yet</div>');
                return;
            }

            var html = '';
            for (var i = 0; i < state.sanList.length; i += 2) {
                var num = Math.floor(i / 2) + 1;
                var cls1 = (i === state.sanList.length - 1) ? 'move-san latest' : 'move-san';
                var cls2 = (i + 1 === state.sanList.length - 1) ? 'move-san latest' : 'move-san';
                html += '<div class="move-row">';
                html += '<span class="move-num">' + num + '.</span>';
                html += '<span class="' + cls1 + '">' + state.sanList[i] + '</span>';
                if (state.sanList[i + 1]) {
                    html += '<span class="' + cls2 + '">' + state.sanList[i + 1] + '</span>';
                }
                html += '</div>';
            }
            $list.html(html);
            $list.scrollTop($list[0].scrollHeight);
        }

        // --- Timer ---
        function startTimer() {
            stopTimer();
            timerInterval = setInterval(function() {
                if (state.gameover) { stopTimer(); return; }
                if (state.turn === 'white') {
                    whiteTime -= 1;
                    if (whiteTime <= 0) { whiteTime = 0; stopTimer(); }
                    $('#white-timer').text(formatTime(whiteTime));
                } else {
                    blackTime -= 1;
                    if (blackTime <= 0) { blackTime = 0; stopTimer(); }
                    $('#black-timer').text(formatTime(blackTime));
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        }

        function formatTime(sec) {
            var m = Math.floor(sec / 60);
            var s = sec % 60;
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        // --- New game ---
        function newGame() {
            $.ajax({
                url: '/api/new-game',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({}),
                success: function(res) {
                    state.fen = res.fen;
                    state.legal = res.legal;
                    state.turn = res.turn;
                    state.sanList = [];
                    state.inCheck = false;
                    state.gameover = false;
                    state.fenHistory = [];
                    lastUci = null;
                    isAiThinking = false;
                    $('#thinking').hide();
                    $('#gameover-overlay').removeClass('active');
                    whiteTime = 600;
                    blackTime = 600;
                    $('#white-timer').text('10:00');
                    $('#black-timer').text('10:00');
                    startTimer();
                    renderBoard();
                    renderStatus();
                    renderMoves();
                },
                error: function() { console.error('New game failed'); }
            });
        }

        // --- Undo ---
        function undoMove() {
            if (state.fenHistory.length === 0) return;
            var prevFen = state.fenHistory[state.fenHistory.length - 1];

            $.ajax({
                url: '/api/undo',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ fen: state.fen }),
                success: function(res) {
                    state.fenHistory.pop();
                    state.fen = res.fen;
                    state.legal = res.legal;
                    state.turn = res.turn;
                    state.inCheck = res.in_check || false;
                    state.gameover = false;
                    if (state.sanList.length > 0) state.sanList.pop();
                    if (state.sanList.length > 0) state.sanList.pop();
                    if (lastUci) {
                        // We can't easily undo lastUci without history, set to null
                    }
                    $('#gameover-overlay').removeClass('active');
                    isAiThinking = false;
                    $('#thinking').hide();
                    renderBoard();
                    renderStatus();
                    renderMoves();
                },
                error: function() { console.error('Undo failed'); }
            });
        }

        // --- Flip board ---
        function flipBoard() {
            orientation = orientation === 'white' ? 'black' : 'white';
            renderBoard();
        }

        // --- Event listeners ---
        $('#btn-new').on('click', newGame);
        $('#btn-new-gameover').on('click', newGame);
        $('#btn-undo').on('click', undoMove);
        $('#btn-flip').on('click', flipBoard);

        // --- Init ---
        newGame();
    })();
    </script>
</body>
</html>
