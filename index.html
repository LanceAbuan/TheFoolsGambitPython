<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Fool's Gambit — Training</title>
    <link rel="icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/chessboard.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
        .header p { color: #666; font-size: 13px; margin-top: 4px; }
        .main {
            display: flex;
            gap: 24px;
            padding: 24px;
            max-width: 1100px;
            margin: 0 auto;
            align-items: flex-start;
        }
        .train-main {
            flex: 1;
            min-width: 0;
        }
        .train-sidebar {
            display: none;
        }
        .panel {
            background: #12122a;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .panel-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #555;
            margin-bottom: 16px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .metric-card {
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .metric-value {
            font-size: 28px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            color: #a5b4fc;
        }
        .metric-label {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .status-badge.playing { background: rgba(74,222,128,0.15); color: #4ade80; }
        .status-badge.training { background: rgba(99,102,241,0.15); color: #818cf8; }
        .status-badge.idle { background: rgba(255,255,255,0.06); color: #888; }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        .playing .status-dot { background: #4ade80; }
        .training .status-dot { background: #818cf8; }
        .idle .status-dot { background: #888; animation: none; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .live-board-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }
        #live-board { width: 280px; }
        .live-status {
            text-align: center;
            font-size: 12px;
            color: #888;
            padding: 8px;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .game-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .game-list::-webkit-scrollbar { width: 4px; }
        .game-list::-webkit-scrollbar-track { background: transparent; }
        .game-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        .game-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .game-num { color: #555; font-size: 12px; }
        .game-mode { font-size: 10px; color: #6366f1; background: rgba(99,102,241,0.1); padding: 1px 6px; border-radius: 4px; }
        .game-result { font-weight: 700; font-size: 13px; }
        .game-result.w { color: #4ade80; }
        .game-result.l { color: #f87171; }
        .game-result.d { color: #fbbf24; }
        .game-moves { color: #555; font-family: monospace; font-size: 11px; }
        .loss-bar {
            height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 2px;
            margin-top: 12px;
            overflow: hidden;
        }
        .loss-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #a5b4fc);
            transition: width 0.5s;
        }
        .log-box {
            background: #08081a;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #666;
            max-height: 200px;
            overflow-y: auto;
            line-height: 1.6;
        }
        .log-entry { border-bottom: 1px solid rgba(255,255,255,0.02); padding: 2px 0; }
        .log-time { color: #444; }
        @media (max-width: 768px) {
            .main { flex-direction: column; padding: 16px; }
            .train-sidebar { width: 100%; }
            #live-board { width: 240px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>The Fool's Gambit</h1>
        <p>Training a chess AI from scratch using AlphaZero</p>
    </div>

    <div class="main">
        <div class="train-main">
            <div class="panel">
                <div class="panel-title">Live Training</div>
                <div id="status-badge" class="status-badge idle">
                    <span class="status-dot"></span>
                    <span id="status-text">Connecting...</span>
                </div>
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-value" id="m-step">—</div>
                        <div class="metric-label">Training Step</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="m-games">—</div>
                        <div class="metric-label">Games Played</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="m-buffer">—</div>
                        <div class="metric-label">Buffer Size</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="m-loss">—</div>
                        <div class="metric-label">Loss</div>
                    </div>
                </div>
                <div class="loss-bar"><div class="loss-fill" id="loss-fill" style="width:100%"></div></div>

                <div class="live-board-wrap">
                    <div id="live-board"></div>
                </div>
                <div class="live-status" id="live-status">Waiting for game...</div>
            </div>

            <div class="panel" style="margin-top:16px;">
                <div class="panel-title">Recent Games</div>
                <div class="game-list" id="game-list">
                    <div style="color:#555; font-style:italic; padding:12px 0;">No games yet</div>
                </div>
            </div>

            <div class="panel" style="margin-top:16px;">
                <div class="panel-title">Training Log</div>
                <div class="log-box" id="log-box"></div>
            </div>
        </div>

        <div class="train-sidebar">
            <div class="panel">
                <div class="panel-title">Model</div>
                <div id="model-info" style="font-size:12px; color:#888; line-height:1.8;">
                    <div>Learning Rate: <span id="m-lr">—</span></div>
                    <div>Policy Loss: <span id="m-pl">—</span></div>
                    <div>Value Loss: <span id="m-vl">—</span></div>
                    <div>Model Size: <span id="m-size">—</span></div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Hugging Face</div>
                <div id="hf-info" style="font-size:12px; color:#888; line-height:1.8;">
                    <div>Repo: <span id="m-repo" style="color:#6366f1;">—</span></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/jquery.min.js"></script>
    <script src="/static/chessboard.js"></script>
    <script>
    var exports = {};
    var module = { exports: exports };
    </script>
    <script src="/static/chess.js"></script>
    <script>
    window.Chess = exports.Chess || module.exports.Chess || exports;
    </script>
    <script>
    (function () {
        var liveBoard = null;
        var liveMoves = [];
        var logEntries = [];

        /* ---------- Live Board ---------- */

        function initLiveBoard() {
            var config = {
                position: 'start',
                orientation: 'white',
                pieceTheme: function (piece) {
                    return '/static/img/chesspieces/wikipedia/' + piece + '.png';
                },
                draggable: false,
                showNotation: true
            };
            liveBoard = Chessboard('live-board', config);
        }

        function updateLiveBoard(moves) {
            if (!moves || moves.length === 0) return;
            liveMoves = moves;
            var c = new Chess();
            for (var i = 0; i < moves.length; i++) {
                try { c.move(moves[i]); } catch(e) { break; }
            }
            liveBoard.position(c.fen());
            var last = moves[moves.length - 1] || '';
            $('#live-status').text(liveMoves.length + ' moves | Last: ' + last);
        }

        /* ---------- Status ---------- */

        function updateStatus(status) {
            var badge = $('#status-badge');
            badge.removeClass('playing training idle').addClass(status.status || 'idle');
            $('#status-text').text((status.status || 'idle').toUpperCase());

            $('#m-step').text(status.step != null ? status.step.toLocaleString() : '—');
            $('#m-games').text(status.games_played != null ? status.games_played.toLocaleString() : '—');
            $('#m-buffer').text(status.buffer_size != null ? status.buffer_size.toLocaleString() : '—');
            $('#m-loss').text(status.loss ? status.loss.toFixed(4) : '—');

            var lossPct = status.loss ? Math.max(0, Math.min(100, (1 - status.loss) * 100)) : 100;
            $('#loss-fill').css('width', lossPct + '%');

            $('#m-lr').text(status.learning_rate ? status.learning_rate : '—');
            $('#m-pl').text(status.policy_loss ? status.policy_loss.toFixed(4) : '—');
            $('#m-vl').text(status.value_loss ? status.value_loss.toFixed(4) : '—');
            $('#m-size').text(status.model_size ? (status.model_size / 1024 / 1024).toFixed(2) + ' MB' : '—');

            if (status.hf_repo) $('#m-repo').text(status.hf_repo);

            if (status.recent_games && status.recent_games.length > 0) {
                renderGames(status.recent_games);
            }

            if (status.current_game && status.current_game.moves) {
                updateLiveBoard(status.current_game.moves);
            }
        }

        function renderGames(games) {
            var html = '';
            for (var i = games.length - 1; i >= 0; i--) {
                var g = games[i];
                var cls = 'd';
                if (g.result === '1-0' || g.result === '0-1') cls = (g.result === '1-0' ? 'w' : 'l');
                var mode = (g.mode || 'self-play').toUpperCase();
                var moves = '';
                if (g.pgn) {
                    var parts = g.pgn.split(' ').filter(function(s){ return s; });
                    moves = parts.slice(-8).join(' ') + (parts.length > 8 ? '...' : '');
                }
                html += '<div class="game-item">';
                html += '<div class="game-header">';
                html += '<span class="game-num">#' + g.game_num + ' <span class="game-mode">' + mode + '</span></span>';
                html += '<span class="game-result ' + cls + '">' + (g.result || '*') + '</span>';
                html += '</div>';
                if (moves) html += '<div class="game-moves">' + moves + '</div>';
                html += '</div>';
            }
            $('#game-list').html(html);
        }

        /* ---------- Log ---------- */

        function addLog(msg) {
            var now = new Date();
            var ts = now.toTimeString().split(' ')[0];
            logEntries.push('<span class="log-time">[' + ts + ']</span> ' + msg);
            if (logEntries.length > 100) logEntries.shift();
            $('#log-box').html(logEntries.join('<br>'));
            var el = document.getElementById('log-box');
            el.scrollTop = el.scrollHeight;
        }

        /* ---------- SSE ---------- */

        function connectSSE() {
            try {
                var source = new EventSource('/api/train/stream');
                source.addEventListener('game_start', function(e) {
                    var data = JSON.parse(e.data);
                    $('#live-status').text('New ' + data.mode + ' game starting...');
                    liveBoard.position('start');
                    liveMoves = [];
                    addLog('Game started (' + data.mode + ')');
                });
                source.addEventListener('game_progress', function(e) {
                    var data = JSON.parse(e.data);
                    if (data.moves) updateLiveBoard(data.moves);
                    $('#live-status').text('Status: ' + data.status + ' | ' + (data.moves ? data.moves.length : 0) + ' moves');
                });
                source.addEventListener('train_step', function(e) {
                    var data = JSON.parse(e.data);
                    if (data.data) {
                        addLog('Step ' + data.data.step + ' | loss=' + (data.data.loss ? data.data.loss.toFixed(4) : '?'));
                    }
                });
                source.addEventListener('status_update', function(e) {
                    var data = JSON.parse(e.data);
                    if (data.data) updateStatus(data.data);
                });
                source.addEventListener('training_stopped', function(e) {
                    addLog('Training stopped');
                    $('#status-badge').removeClass('playing training').addClass('idle');
                    $('#status-text').text('STOPPED');
                });
                source.onerror = function() {};
                addLog('SSE connected');
            } catch(e) {
                addLog('SSE failed: ' + e.message);
            }
        }

        /* ---------- Poll ---------- */

        function pollStatus() {
            $.ajax({
                url: '/api/train/status',
                method: 'GET',
                timeout: 5000,
                success: function(status) {
                    updateStatus(status);
                },
                error: function() {
                    // Don't spam errors in log
                }
            });
        }

        /* ---------- Init ---------- */

        $(function () {
            initLiveBoard();
            pollStatus();
            setInterval(pollStatus, 2000);
            connectSSE();
        });
    })();
    </script>
</body>
</html>
