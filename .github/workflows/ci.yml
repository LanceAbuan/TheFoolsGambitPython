name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Build React app
        run: cd client && npm run build

      - name: Verify Vercel config
        run: |
          python3 -c "
          import json
          with open('vercel.json') as f:
            config = json.load(f)
          assert config['version'] == 2
          assert config['outputDirectory'] == 'client/dist'
          assert config['buildCommand']
          assert any('/index.html' in r.get('destination', '') for r in config.get('rewrites', []))
          print('Vercel config valid')
          "

      - name: API health check
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://api.lanceabuan.tech/api/train/status 2>&1) || true
          if [ "$HTTP_CODE" = "200" ]; then
            echo "API server is healthy"
          else
            echo "API server not reachable (expected on PRs from forks)"
          fi

  deploy-check:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Health check live site
        run: |
          echo "Checking live deployment..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://gambit.lanceabuan.tech)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Site returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Live site is healthy"

      - name: API health check
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://api.lanceabuan.tech/api/train/status)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "API returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "API server is healthy"
