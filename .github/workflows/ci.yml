name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install API dependencies
        run: npm install

      - name: API smoke tests
        run: |
          node -e "
          const handler = require('./api/index.js');

          const makeReq = (url, body) => ({ method: 'POST', url, body: typeof body === 'string' ? body : JSON.stringify(body) });
          const makeRes = () => { const r = { _body: null }; r.setHeader = () => r; r.status = (s) => r; r.json = (d) => { r._body = d; return r; }; r.end = () => r; return r; };
          const call = (url, body) => new Promise(resolve => { const r = makeRes(); handler(makeReq(url, body), r).then(() => resolve(r._body)); });

          (async () => {
            // 1. New game
            let state = await call('/api/new-game', {});
            if (state.status !== 'active') throw new Error('new-game: expected active');
            if (state.turn !== 'white') throw new Error('new-game: expected white to move');

            // 2. Make move
            state = await call('/api/make-move', { fen: state.fen, uci: 'e2e4' });
            if (state.status !== 'active') throw new Error('make-move: expected active');
            if (state.turn !== 'black') throw new Error('make-move: expected black to move');
            if (state.pgn !== 'e4') throw new Error('make-move: expected e4');

            // 3. AI move
            state = await call('/api/ai-move', { fen: state.fen, aiDepth: 2 });
            if (state.status !== 'active') throw new Error('ai-move: expected active');
            if (state.turn !== 'white') throw new Error('ai-move: expected white to move');

            // 4. Illegal move
            state = await call('/api/make-move', { fen: state.fen, uci: 'e2e8' });
            if (!state.error) throw new Error('illegal: expected error');

            // 5. Undo
            state = await call('/api/undo', { fen: (await call('/api/new-game', {})).fen });
            if (state.status !== 'active') throw new Error('undo: expected active');

            console.log('All API tests passed');
          })().catch(e => { console.error('Test failed:', e.message); process.exit(1); });
          "

      - name: Verify Vercel config
        run: |
          python3 -c "
          import json
          with open('vercel.json') as f:
            config = json.load(f)
          assert config['version'] == 2
          assert any('/api/' in r.get('source', '') for r in config.get('rewrites', []))
          print('Vercel config valid')
          "

  deploy-check:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Health check live site
        run: |
          echo "Checking live deployment..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://gambit.lanceabuan.tech)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Site returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Live site is healthy"
