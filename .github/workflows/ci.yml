name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 TheFoolsGambitPython/backend/ ai.py --max-line-length=120 --ignore=E501,W503 || true

      - name: Smoke test engine
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'TheFoolsGambitPython/backend')
          from game import new_game, make_move, ai_move

          # New game
          g = new_game()
          assert g['status'] == 'active'
          assert g['turn'] == 'white'
          assert g['fen'].startswith('rnbqkbnr')

          # Play e4
          r = make_move(g['fen'], 'e2e4')
          assert r['status'] == 'active'
          assert r['turn'] == 'black'

          # AI responds
          r2 = ai_move(r['fen'], ai_depth=3)
          assert r2['status'] == 'active'
          assert r2['turn'] == 'white'

          # Illegal move should fail
          r3 = make_move(g['fen'], 'e2e8')
          assert 'error' in r3

          print('All smoke tests passed')
          "
