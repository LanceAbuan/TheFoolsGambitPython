name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web client (Svelte 5 + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (svelte-check)
        run: npm run check

      - name: Build
        run: npm run build

  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Lint (ruff)
        run: uv run --no-project --with ruff ruff check .

      - name: Tests (pytest)
        run: |
          if [ -d tests ]; then
            uv sync --frozen
            uv run pytest -q
          else
            echo "tests/ not present yet — pytest gate activates with WP-A (backend)"
          fi
